name: fundi_link
description: "FundiLink - Connect with trusted local fundis and service providers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Navigation
  go_router: ^14.6.2
  
  # Network
  http: ^1.2.2
  
  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.6
  
  # UI Components
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  photo_view: ^0.15.0
  image_picker: ^1.1.2
  flutter_rating_bar: ^4.0.1
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0
  timeago: ^3.7.0
  uuid: ^4.5.0
  equatable: ^2.0.5
  
  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
